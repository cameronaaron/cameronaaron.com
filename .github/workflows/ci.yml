name: CI

# Re-enabled 2026-08 (repo went public — GitHub Actions minutes are free for
# public repos on standard runners, so the 2026-07 cost concern that disabled
# this no longer applies). Runs on every push and pull request in addition to
# the local pre-commit/pre-push hooks, which stay as the fast local gate.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modularization-guard:
    name: Modularization Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run modularization and logic-module guard tests
        run: pnpm run test:modularization

      - name: Run repository hygiene contract tests
        run: pnpm run test:repo:hygiene

  quality-checks:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    needs:
      - modularization-guard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pages parity contracts
        run: pnpm run test:pages:parity

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript checks
        run: pnpm run type-check

      - name: Run dependency freshness and security gate
        run: pnpm run test:freshness
        env:
          # Raises the GitHub API rate limit for the Actions-pin freshness
          # check from 60/hr (unauthenticated) to 5000/hr — avoids flaking
          # under concurrent CI runs. Read-only; no extra permissions needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run test coverage gate
        run: pnpm run test:coverage

      - name: Run V8 coverage cross-check
        run: pnpm run test:coverage:v8

      - name: Run production build
        run: pnpm run build

      - name: Run static performance budget contracts
        run: pnpm run test:performance:contracts

      - name: Run SEO integrity checks
        run: pnpm run seo:check

  lighthouse-desktop:
    name: Lighthouse Assertions (Desktop)
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  lighthouse-mobile:
    name: Lighthouse Assertions (Mobile)
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: true
