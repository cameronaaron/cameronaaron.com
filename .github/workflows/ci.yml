name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modularization-guard:
    name: Modularization Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run modularization and logic-module guard tests
        run: pnpm run test:modularization

      - name: Run repository hygiene contract tests
        run: pnpm run test:repo:hygiene

  quality-checks:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    needs:
      - modularization-guard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pages parity contracts
        run: pnpm run test:pages:parity

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript checks
        run: pnpm run type-check

      - name: Run dependency freshness and security gate
        run: pnpm run test:freshness

      - name: Run test coverage gate
        run: pnpm run test:coverage

      - name: Run V8 coverage cross-check
        run: pnpm run test:coverage:v8

      - name: Run production build
        run: pnpm run build

      - name: Run static performance budget contracts
        run: pnpm run test:performance:contracts

      - name: Run SEO integrity checks
        run: pnpm run seo:check

  lighthouse-desktop:
    name: Lighthouse Assertions (Desktop)
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  lighthouse-mobile:
    name: Lighthouse Assertions (Mobile)
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.mobile.json
          uploadArtifacts: true
          temporaryPublicStorage: true
