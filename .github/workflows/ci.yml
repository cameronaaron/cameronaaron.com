name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-order-guard:
    name: Enforce Deploy Ordering
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy workflow trigger contract
        run: |
          set -euo pipefail

          workflow_file=".github/workflows/deploy-production.yml"

          grep -Eq '^\s*workflow_run:' "$workflow_file"
          grep -Eq '^\s*workflows:\s*$|^\s*workflows:\s*\[\s*CI\s*\]' "$workflow_file"
          grep -Eq '^\s*-\s*CI\s*$|^\s*workflows:\s*\[\s*CI\s*\]' "$workflow_file"
          grep -Eq '^\s*-\s*completed\s*$|^\s*types:\s*\[\s*completed\s*\]' "$workflow_file"

          if grep -Eq '^\s*push:\s*$' "$workflow_file"; then
            echo "Direct push trigger detected in deploy workflow; deployment ordering is no longer enforced."
            exit 1
          fi

  modularization-guard:
    name: Modularization Guard
    runs-on: ubuntu-latest
    needs: workflow-order-guard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run modularization and logic-module guard tests
        run: npm run test:modularization

  quality-checks:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    needs:
      - workflow-order-guard
      - modularization-guard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Pages parity contracts
        run: npm run test:pages:parity

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run type-check

      - name: Run test coverage gate
        run: npm run test:coverage

      - name: Run production build
        run: npm run build

      - name: Run SEO integrity checks
        run: npm run seo:check

  lighthouse:
    name: Lighthouse Assertions
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
