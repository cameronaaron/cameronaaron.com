allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260714.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260714.1'
  - '@cloudflare/workerd-linux-64@1.20260714.1'
  - '@cloudflare/workerd-linux-arm64@1.20260714.1'
  - '@cloudflare/workerd-windows-64@1.20260714.1'
  - miniflare@4.20260714.0
  - workerd@1.20260714.1
  - wrangler@4.112.0
overrides:
  postcss: ">=8.5.20"
  "@opentelemetry/core": ">=2.8.0"
  # GHSA-q8mj-m7cp-5q26 (moderate): qs.stringify DoS, fixed >=6.15.2.
  # Pulled in transitively via @stryker-mutator/core > typed-rest-client > qs.
  qs: ">=6.15.2"
  # GHSA-3jxr-9vmj-r5cp (high): brace-expansion DoS via exponential-time
  # expansion of consecutive non-expanding {} groups. Two independent majors
  # are in the tree, each with its own patch line, so the floors are scoped
  # per-major rather than one blanket range (a single ">=1.1.16" would collapse
  # both consumers onto one major and break the 2.x API contract):
  #   1.x — via eslint-config-next > eslint-plugin-import > minimatch
  #   2.x — via lighthouse > @sentry/node > minimatch
  # Both are devDependencies, so nothing vulnerable ever shipped to a visitor.
  brace-expansion@1: ">=1.1.16"
  brace-expansion@2: ">=2.1.2"
patchedDependencies:
  next@16.2.10: patches/next@16.2.10.patch
