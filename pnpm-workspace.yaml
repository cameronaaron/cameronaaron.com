allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260903.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260903.1'
  - '@cloudflare/workerd-linux-64@1.20260903.1'
  - '@cloudflare/workerd-linux-arm64@1.20260903.1'
  - '@cloudflare/workerd-windows-64@1.20260903.1'
  - miniflare@5.20260903.0-alpha
  - workerd@1.20260903.1
  - wrangler@4.129.0
overrides:
  postcss: ">=8.5.20"
  "@opentelemetry/core": ">=2.8.0"
  # GHSA-f88m-g3jw-g9cj (high): sharp inherits libvips CVE-2026-33327/-33328/
  # -35590/-35591 (malicious-image parsing), fixed >=0.35.0. Our own direct
  # dependency was already on 0.35.3, but next declares its own
  # OPTIONAL sharp as "^0.34.5" (a 0.x caret, so it caps below 0.35.0) and
  # miniflare pins an exact 0.35.2 — two separate, undeduped copies pnpm
  # resolved alongside ours. This forces every resolution in the tree onto
  # our already-patched version instead of ignoring the advisory.
  sharp: ">=0.35.3"
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g:
  # qs parsing/stringifying denial of service; all fixed in >=6.16.0.
  # Pulled in transitively via @stryker-mutator/core > typed-rest-client > qs.
  qs: ">=6.16.0 <7"
  # GHSA-3jxr-9vmj-r5cp (high): brace-expansion DoS via exponential-time
  # expansion of consecutive non-expanding {} groups. Two independent majors
  # are in the tree, each with its own patch line, so the floors are scoped
  # per-major rather than one blanket range (a single ">=1.1.16" would collapse
  # both consumers onto one major and break the 2.x API contract):
  #   1.x — via eslint-config-next > eslint-plugin-import > minimatch
  #   2.x — via lighthouse > @sentry/node > minimatch
  # Both are devDependencies, so nothing vulnerable ever shipped to a visitor.
  brace-expansion@1: ">=1.1.16"
  brace-expansion@2: ">=2.1.2"
  # GHSA-mh99-v99m-4gvg (high, distinct from GHSA-3jxr-9vmj-r5cp above):
  # unbounded-expansion-length DoS, fixed >=5.0.8. minimatch@10.2.5 (pulled in
  # via eslint's own dependency chain) moved onto a THIRD brace-expansion major
  # the two floors above don't cover. Same devDependency-only exposure.
  brace-expansion@5: ">=5.0.8"
  # GHSA-pm4m-ph32-ghv5 (high): js-yaml exponential-time parsing of flow
  # collections, fixed >=5.2.2. Pulled in via markdownlint-cli2, build-time only.
  js-yaml: ">=5.2.2"
  # GHSA-2v37-7h3g-55p8 (high): nanoid custom generators loop indefinitely
  # when size is zero, fixed >=3.3.17. Pulled in transitively via postcss
  # (both our own pin and vitest/vite's independent copy) — build-time only,
  # nothing vulnerable ever ships to a visitor.
  nanoid: ">=3.3.17"
  # GHSA-8xcm-r25x-g524 / GHSA-4cwx-7wf7-3272 / GHSA-m8rv-5g2x-5cg5 /
  # GHSA-jr45-8vmc-qm54 / GHSA-v3r7-h72x-cjcm: undici response desync, cache
  # info-leak, CRLF injection, and cookie-attribute-injection bugs, all fixed
  # >=7.29.0. Pulled in transitively via wrangler > miniflare, pinned at
  # 7.28.0. Scoped to the 7.x major — jsdom's independent 8.x copy is already
  # above the patched floor. Dev-only (wrangler/miniflare never ship).
  undici@7: ">=7.29.0"
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: unbounded caches and
  # malformed custom stats in the build toolchain, fixed in 4.28.7.
  browserslist: ">=4.28.7 <5"
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf /
  # GHSA-jqff-g426-hqxp: URI host normalization bugs, fixed in 3.1.6.
  fast-uri@3: ">=3.1.6 <4"
patchedDependencies:
  next@16.3.4: patches/next@16.3.4.patch
